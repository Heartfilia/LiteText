name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's supported Apple Silicon image; macOS 14 is retired.
          - runner: macos-15
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            os: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            os: windows
            arch: x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      LITETEXT_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/package_release.py --os ${{ matrix.os }} --arch ${{ matrix.arch }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 manifest
        working-directory: dist
        run: find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: LiteText ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS
